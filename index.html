<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NINI 新品首發・訂購登記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#161412;
  --ink-60:rgba(22,20,18,.60);
  --ink-38:rgba(22,20,18,.38);
  --ink-14:rgba(22,20,18,.14);
  --ink-07:rgba(22,20,18,.07);
  --paper:#F5F0EA;
  --card:#FBF8F4;
  --rose:#C4A499;
  --rose-dp:#9E7E72;
  --rose-tint:rgba(196,164,153,.16);
  --ok:#5C7A66;
  --warn:#B4713A;
  --serif:"Noto Serif TC",serif;
  --sans:"Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-bottom:40px}
.num{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* header */
header{padding:22px 0 14px;border-bottom:1px solid var(--ink-14);margin-bottom:0}
h1{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:.06em;margin:0}
.sub{font-size:12px;color:var(--ink-60);letter-spacing:.08em;margin-top:4px}
.plusflag{margin-top:10px;font-size:12.5px;padding:7px 11px;border-radius:3px;background:var(--rose-tint);color:var(--rose-dp);font-weight:500}
.plusflag.off{background:var(--ink-07);color:var(--ink-60)}
.syncrow{margin-top:8px;font-size:11.5px;color:var(--ink-38);display:flex;align-items:center;gap:8px}
.syncrow button{border:1px solid var(--ink-14);background:#fff;border-radius:3px;font-size:11px;padding:3px 9px;cursor:pointer;color:var(--ink-60)}
.syncrow .bad{color:var(--warn)}

/* tabs */
nav{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--ink-14)}
nav .wrap{display:flex;gap:2px}
nav button{flex:1;appearance:none;border:0;background:none;font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.1em;color:var(--ink-38);padding:13px 0 11px;border-bottom:2px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rose)}

section{display:none;padding-top:18px}
section.on{display:block}

/* shared */
.card{background:var(--card);border:1px solid var(--ink-14);border-radius:4px;padding:15px;margin-bottom:12px}
.eyebrow{font-family:var(--serif);font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--rose-dp);margin:22px 0 9px;display:flex;align-items:center;gap:9px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--ink-14)}
.eyebrow:first-child{margin-top:0}
summary.eyebrow{cursor:pointer;list-style:none}
summary.eyebrow::-webkit-details-marker{display:none}
summary.eyebrow::before{content:"▸";font-size:10px;color:var(--rose-dp)}
details[open] summary.eyebrow::before{content:"▾"}
label.fl{display:block;font-size:12px;letter-spacing:.06em;color:var(--ink-60);margin-bottom:5px}
input[type=text],input[type=number],textarea,select{width:100%;font-family:var(--sans);font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--ink-14);border-radius:3px;padding:10px 11px}
textarea{min-height:62px;resize:vertical;font-size:15px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--rose);outline-offset:1px;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* product stepper */
.pline{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--ink-07)}
.pline:last-child{border-bottom:0}
.pline.picked .pname{font-weight:700}
.pinfo{flex:1;min-width:0}
.pstep{font-size:10.5px;letter-spacing:.1em;color:var(--rose-dp);text-transform:uppercase}
.pname{font-size:14.5px;line-height:1.35}
.pprice{font-size:12px;color:var(--ink-60)}
.stp{display:flex;align-items:center;gap:0;flex:none}
.stp button{width:32px;height:32px;border:1px solid var(--ink-14);background:#fff;color:var(--ink);font-size:17px;line-height:1;cursor:pointer;border-radius:3px}
.stp button:disabled{color:var(--ink-14);cursor:default}
.stp .q{width:34px;text-align:center;font-size:15px;font-weight:700}
.stp .q.zero{color:var(--ink-38);font-weight:400}

/* signature: tier meter */
.meter{position:sticky;bottom:0;z-index:20;background:var(--ink);color:var(--paper);border-radius:4px;padding:14px 15px;margin:16px 0 4px;box-shadow:0 6px 22px rgba(22,20,18,.22)}
.meter .top{display:flex;justify-content:space-between;align-items:baseline}
.meter .amt{font-family:var(--serif);font-size:27px;font-weight:700}
.meter .tier{font-size:12px;letter-spacing:.08em;color:var(--rose)}
.bar{height:3px;background:rgba(245,240,234,.2);border-radius:2px;margin:11px 0 9px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--rose);border-radius:2px;transition:width .35s cubic-bezier(.2,.7,.3,1)}
.gap{font-size:13px;line-height:1.5}
.gap b{color:var(--rose);font-weight:700}
.gap2{font-size:12.5px;line-height:1.5;margin-top:6px;color:rgba(245,240,234,.66);display:none}
.gap2.on{display:block}
.gap2 b{color:var(--rose);font-weight:700}
.gifts{font-size:12px;color:rgba(245,240,234,.68);margin-top:8px;border-top:1px solid rgba(245,240,234,.16);padding-top:8px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:13px;padding:8px 13px;border:1px solid var(--ink-14);background:#fff;border-radius:999px;cursor:pointer;user-select:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:disabled{opacity:.34;cursor:not-allowed}
.hint{font-size:11.5px;color:var(--ink-60);margin-top:6px}
.hint.warn{color:var(--warn)}

.btn{width:100%;appearance:none;border:0;background:var(--ink);color:var(--paper);font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.14em;padding:14px;border-radius:3px;cursor:pointer;margin-top:16px}
.btn.ghost{background:none;color:var(--ink-60);border:1px solid var(--ink-14);letter-spacing:.08em;font-size:13px;padding:11px}

/* orders */
.oc{background:var(--card);border:1px solid var(--ink-14);border-left:3px solid var(--ink-14);border-radius:4px;padding:13px 14px;margin-bottom:10px}
.oc.paid{border-left-color:var(--ok)}
.oc.part{border-left-color:var(--warn)}
.oc .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.oc .nm{font-family:var(--serif);font-size:16px;font-weight:600}
.oc .tt{font-size:16px;font-weight:700}
.oc .items{font-size:12.5px;color:var(--ink-60);margin-top:5px;line-height:1.55}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:11px;letter-spacing:.04em;padding:3px 8px;border-radius:2px;background:var(--ink-07);color:var(--ink-60)}
.tag.g{background:rgba(92,122,102,.14);color:var(--ok)}
.tag.w{background:rgba(180,113,58,.14);color:var(--warn)}
.tag.r{background:var(--rose-tint);color:var(--rose-dp)}
.oc .acts{display:flex;gap:8px;margin-top:11px}
.oc .acts button{flex:1;font-size:12px;padding:8px;border:1px solid var(--ink-14);background:#fff;border-radius:3px;cursor:pointer;color:var(--ink-60)}

/* table */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 4px;border-bottom:1px solid var(--ink-07)}
th{font-size:11px;letter-spacing:.1em;color:var(--ink-38);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{border-bottom:0;border-top:1.5px solid var(--ink);font-weight:700;font-size:15px;padding-top:13px}

/* stats */
.goal{background:var(--ink);color:var(--paper);border-radius:4px;padding:17px;margin-bottom:12px}
.goal .n{font-family:var(--serif);font-size:32px;font-weight:700}
.goal .l{font-size:12px;letter-spacing:.1em;color:var(--rose)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--ink-14);border-radius:4px;padding:13px}
.stat .n{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;color:var(--ink-60);letter-spacing:.05em}
.qbar{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--ink-07)}
.qbar .lb{flex:1;font-size:13px}
.qbar .track{width:78px;height:6px;background:var(--ink-07);border-radius:3px;overflow:hidden}
.qbar .track i{display:block;height:100%;background:var(--rose)}
.qbar .track i.low{background:var(--warn)}
.qbar .v{width:52px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

.gm-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.gm-row input[type=text]{flex:1}
.gm-row input[type=number]{width:66px;flex:none;padding:10px 6px;text-align:center}
.gm-row button{width:36px;height:38px;flex:none;border:1px solid var(--ink-14);background:#fff;border-radius:3px;cursor:pointer;color:var(--ink-60);font-size:16px}

.empty{text-align:center;padding:44px 20px;color:var(--ink-38);font-size:14px}
.empty b{display:block;font-family:var(--serif);font-size:15px;color:var(--ink-60);margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:3px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* lock screen */
body:not(.unlocked) .wrap, body:not(.unlocked) nav{display:none}
#lockscreen{position:fixed;inset:0;z-index:200;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
body.unlocked #lockscreen{display:none}
.lockbox{max-width:300px;width:100%;text-align:center}
.lockbox h2{font-family:var(--serif);font-size:18px;font-weight:700;margin:0 0 6px;letter-spacing:.04em}
.lockbox p{font-size:12.5px;color:var(--ink-60);margin:0 0 18px}
.lockbox input{text-align:center;letter-spacing:.3em;font-size:18px}
.lockbox .err{color:var(--warn);font-size:12px;margin-top:9px;min-height:16px}
</style>

<div id="lockscreen">
  <div class="lockbox">
    <h2>NINI 新品首發・訂購登記</h2>
    <p>請輸入通行密碼</p>
    <input type="password" id="lock-pw" inputmode="numeric" placeholder="••••" autocomplete="off">
    <button class="btn" onclick="tryUnlock()">進入</button>
    <div class="err" id="lock-err"></div>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>新品首發・訂購登記</h1>
    <div class="sub">8/7 – 8/28　NINIの皮膚療癒所</div>
    <div class="plusflag" id="plusflag"></div>
    <div class="syncrow">
      <span id="synctxt">連線中…</span>
      <button onclick="syncFromCloud()">重新整理</button>
    </div>
  </header>
</div>

<nav><div class="wrap">
  <button id="t-new" aria-selected="true" onclick="tab('new')">登記</button>
  <button id="t-list" aria-selected="false" onclick="tab('list')">訂單</button>
  <button id="t-buy" aria-selected="false" onclick="tab('buy')">叫貨</button>
  <button id="t-sum" aria-selected="false" onclick="tab('sum')">總覽</button>
</div></nav>

<div class="wrap">

<!-- 登記 -->
<section id="s-new" class="on">
  <div class="eyebrow">客人</div>
  <div class="row2">
    <div><label class="fl" for="f-name">姓名</label><input type="text" id="f-name" placeholder="王小姐"></div>
    <div><label class="fl" for="f-contact">IG / LINE</label><input type="text" id="f-contact" placeholder="@帳號"></div>
  </div>

  <div class="eyebrow">品項</div>
  <div class="card" id="plist"></div>

  <div class="meter" id="meter">
    <div class="top"><span class="amt num" id="m-amt">NT$0</span><span class="tier" id="m-tier">未達門檻</span></div>
    <div class="bar"><i id="m-bar" style="width:0%"></i></div>
    <div class="gap" id="m-gap">先選品項</div>
    <div class="gap2" id="m-gap2"></div>
    <div class="gifts" id="m-gifts"></div>
  </div>

  <div class="card" id="giftpickbox" style="display:none">
    <div id="gp-serum-wrap">
      <label class="fl">原液——這筆訂單要給哪一款？</label>
      <div class="chips" id="gp-serum-chips"></div>
    </div>
    <div id="gp-hydrosol-wrap" style="margin-top:14px">
      <label class="fl">純露——這筆訂單要給哪一款？</label>
      <div class="chips" id="gp-hydrosol-chips"></div>
    </div>
    <div id="gp-fixed-wrap" style="margin-top:14px">
      <label class="fl">固定加贈——打包時記得放入</label>
      <div class="chips" id="gp-fixed-chips"></div>
    </div>
    <div class="hint">點選要送的品項，會自動對照「叫貨」分頁的庫存算剩餘量。</div>
  </div>

  <div class="eyebrow" id="redeem-eyebrow" style="display:none">回饋金兌換（正裝）</div>
  <div class="card" id="redeembox" style="display:none">
    <div id="redeem-list"></div>
    <div class="hint" id="redeem-summary"></div>
  </div>

  <div class="eyebrow">付款</div>
  <div class="card">
    <label class="fl">方式</label>
    <div class="chips" id="paymethod">
      <button class="chip" data-v="現金" aria-pressed="false" onclick="pick(this,'paymethod')">現金</button>
      <button class="chip" data-v="匯款" aria-pressed="false" onclick="pick(this,'paymethod')">匯款</button>
      <button class="chip" id="chip-linepay" data-v="LINE Pay" aria-pressed="false" onclick="pick(this,'paymethod')">LINE Pay</button>
    </div>
    <div class="hint" id="payhint">LINE Pay 需單筆滿 8,000</div>

    <label class="fl" style="margin-top:15px">狀態</label>
    <div class="chips" id="paystatus">
      <button class="chip" data-v="未付款" aria-pressed="true" onclick="pick(this,'paystatus')">未付款</button>
      <button class="chip" data-v="已付訂金" aria-pressed="false" onclick="pick(this,'paystatus')">已付訂金</button>
      <button class="chip" data-v="已付清" aria-pressed="false" onclick="pick(this,'paystatus')">已付清</button>
    </div>
    <div id="depositbox" style="display:none;margin-top:11px">
      <label class="fl" for="f-dep">已收訂金</label>
      <input type="number" id="f-dep" inputmode="numeric" placeholder="0">
    </div>
  </div>

  <div class="eyebrow">出貨</div>
  <div class="card">
    <div class="chips" id="ship">
      <button class="chip" data-v="待叫貨" aria-pressed="true" onclick="pick(this,'ship')">待叫貨</button>
      <button class="chip" data-v="已叫貨" aria-pressed="false" onclick="pick(this,'ship')">已叫貨</button>
      <button class="chip" data-v="已到貨" aria-pressed="false" onclick="pick(this,'ship')">已到貨</button>
      <button class="chip" data-v="已交付" aria-pressed="false" onclick="pick(this,'ship')">已交付</button>
    </div>
    <label class="fl" style="margin-top:15px" for="f-note">備註（膚況、配方原因、答應過的事）</label>
    <textarea id="f-note" placeholder="兩頰泛紅，Step4 選 AZA。回饋金留到 9 月配原液。"></textarea>
  </div>

  <button class="btn" id="savebtn" onclick="save()">儲存訂單</button>
  <button class="btn ghost" id="cancelbtn" style="display:none" onclick="resetForm()">取消編輯</button>
</section>

<!-- 訂單 -->
<section id="s-list">
  <input type="text" id="q" placeholder="搜尋姓名、帳號、備註" oninput="renderList()" style="margin-bottom:14px">
  <div id="listbox"></div>
</section>

<!-- 叫貨 -->
<section id="s-buy">
  <div class="eyebrow">要跟廠商叫的數量</div>
  <div class="card"><table id="buytable"></table></div>
  <div class="eyebrow">贈品需準備</div>
  <div class="card"><table id="gifttable"></table></div>
  <div class="eyebrow">贈品內容物採購統計</div>
  <div class="card"><table id="giftneeds"></table></div>
  <div class="eyebrow">正裝兌換庫存統計（回饋金換購，現貨售完為止）</div>
  <div class="card"><table id="fullneeds"></table></div>
  <details id="giftmeta-details">
    <summary class="eyebrow">贈品內容物設定</summary>
    <div class="card" id="giftmeta"></div>
  </details>
  <details id="fullstock-details">
    <summary class="eyebrow">正裝庫存設定</summary>
    <div class="card" id="fullstockmeta"></div>
  </details>
  <button class="btn ghost" onclick="exportCSV()">匯出 CSV（給廠商或對帳用）</button>
</section>

<!-- 總覽 -->
<section id="s-sum">
  <div class="goal">
    <div class="l">活動累計</div>
    <div class="n num" id="g-amt">NT$0</div>
    <div class="bar" style="margin:10px 0 7px"><i id="g-bar" style="width:0%"></i></div>
    <div style="font-size:12.5px;color:rgba(245,240,234,.7)" id="g-note"></div>
  </div>
  <div class="grid2">
    <div class="stat"><div class="n num" id="s-cnt">0</div><div class="l">訂單數</div></div>
    <div class="stat"><div class="n num" id="s-avg">NT$0</div><div class="l">平均客單</div></div>
    <div class="stat"><div class="n num" id="s-in">NT$0</div><div class="l">已收</div></div>
    <div class="stat"><div class="n num" id="s-out">NT$0</div><div class="l">未收</div></div>
  </div>
  <div class="eyebrow">加一回饋剩餘份數（各 10 份）</div>
  <div class="card" id="quota"></div>
  <div class="eyebrow">回饋金總額</div>
  <div class="card" id="cashback"></div>
  <button class="btn ghost" onclick="wipe()">清除所有資料</button>
</section>

</div>
<div id="toast"></div>

<script>
/* ====== 雲端同步設定 ======
   1. 開一個新的 Google 試算表（例如「NINI新品訂購登記」）
   2. 上方選單 擴充功能 → Apps Script，貼上專案裡附的 Code.gs 內容
   3. 部署 → 新增部署作業 → 類型選「網頁應用程式」
      執行身分：我　／　誰可以存取：所有人
   4. 複製部署後的網址，貼到下面 SHEETS_URL
====================================== */

/* 共用密碼，換密碼改這行就好，記得告訴會用到這頁的同事 */
const PAGE_PASSWORD = '1909';
const UNLOCK_KEY = 'nini_ordertracker_unlocked';

const CACHE_KEY='nini_neworder_cache_2608';
const CACHE_KEY_G='nini_giftmeta_cache_2608';
const GOAL=120000;

 {id:'clean',step:'Step 1 清潔／卸妝',name:'二合一高效清潔蜜',spec:'150ml',price:1480},
 {id:'probio',step:'Step 2 重建／建構',name:'益生源精萃',spec:'30ml',price:2680},
 {id:'ha',step:'Step 3 淺層補水',name:'4D玻尿酸精華',spec:'30ml',price:1700},
 {id:'snail',step:'Step 4 預防性建構',name:'蝸牛修護凝膠',spec:'50ml',price:2880},
 {id:'bee',step:'Step 4 亮顏嫩膚',name:'蜂萃精華油',spec:'30ml',price:1880},
 {id:'emu',step:'Step 4 舒緩萬用',name:'鴯鶓活顏油',spec:'30ml',price:3180},
 {id:'aza',step:'Step 4 痘痘・毛孔',name:'14% AZA 黃金比例精華乳',spec:'30ml',price:2180},
];
const GIFTS={
 plus10k:{label:'95折禮券 + 旅行養膚組',quota:10},
 plus8k:{label:'98折禮券 + 原液旅行（隨機）',quota:10},
 plus4k:{label:'原液旅行（隨機）',quota:10},
};
const SERUMS=['EGF','神經醯胺','積雪草','藍銅胜肽','穀胱甘肽','兒茶素','維他命C','B3','B5'];
const HYDROSOLS=['洋甘菊','千葉玫瑰','桂花','橙花','葡萄柚'];
const SERUM_FULL_PRICE={EGF:1300,'神經醯胺':1200,'積雪草':900,'穀胱甘肽':1000,'藍銅胜肽':1200,'B5':750,'B3':900,'維他命C':850,'兒茶素':700};
const HYDROSOL_FULL_PRICE={'洋甘菊':550,'千葉玫瑰':550,'桂花':550,'橙花':550,'葡萄柚':350};
const FULL_ITEMS=[...SERUMS.map(n=>({name:n,price:SERUM_FULL_PRICE[n],cat:'serum',spec:'原液 30ml'})), ...HYDROSOLS.map(n=>({name:n,price:HYDROSOL_FULL_PRICE[n],cat:'hydrosol',spec:'純露 100ml'}))];

let orders=[], cart={}, editId=null;
let giftMeta={plus10k:[],cooler:[],stock:[],serumStock:{},hydrosolStock:{},serumStockFull:{},hydrosolStockFull:{}};
let sel={paymethod:'',paystatus:'未付款',ship:'待叫貨'};
let giftPickState={giftSerum:'',giftHydrosol:''};
let checkedFixedItems=new Set();
let redeemCart={};
let editingCash=0;

function parseGiftItems(v){
  if(Array.isArray(v)) return v;
  if(!v) return [];
  try{ const p=JSON.parse(v); return Array.isArray(p)?p:[]; }
  catch(e){ return [{name:String(v), qty:1}]; }
}
function parseGiftMap(v){
  if(v&&typeof v==='object'&&!Array.isArray(v)) return v;
  if(!v) return {};
  try{ const p=JSON.parse(v); return (p&&typeof p==='object'&&!Array.isArray(p))?p:{}; }
  catch(e){ return {}; }
}
function giftItemsText(items){
  return (items||[]).filter(i=>i&&i.name).map(i=>`${i.name}×${i.qty||1}`).join('、');
}

const $=s=>document.querySelector(s);
const nt=n=>'NT$'+Number(n||0).toLocaleString('en-US');
const plusOpen=()=>new Date()<=PLUS_END;

/* ---------- lock screen ---------- */
function tryUnlock(){
  const v=$('#lock-pw').value.trim();
  if(v===PAGE_PASSWORD){
    try{ localStorage.setItem(UNLOCK_KEY,'1'); }catch(e){}
    document.body.classList.add('unlocked');
  }else{
    $('#lock-err').textContent='密碼不對，再試一次';
    $('#lock-pw').value='';$('#lock-pw').focus();
  }
}
function checkUnlock(){
  let ok=false;
  try{ ok=localStorage.getItem(UNLOCK_KEY)==='1'; }catch(e){}
  if(ok) document.body.classList.add('unlocked');
  else $('#lock-pw').addEventListener('keydown',e=>{ if(e.key==='Enter') tryUnlock(); });
}

function tier(t){
  if(t>=10000)return{lv:'滿 10,000',cash:1000,plus:'plus10k',next:null,need:0};
  if(t>=8000) return{lv:'滿 8,000', cash:700, plus:'plus8k', next:10000,need:10000-t};
  if(t>=4000) return{lv:'滿 4,000', cash:200, plus:'plus4k', next:8000, need:8000-t};
  return{lv:'未達門檻',cash:0,plus:null,next:4000,need:4000-t};
}
const subtotal=()=>P.reduce((s,p)=>s+(cart[p.id]||0)*p.price,0);

/* ---------- cloud api ---------- */
function sheetsReady(){ return SHEETS_URL && !SHEETS_URL.includes('PASTE_'); }
function qs(params){
  return Object.keys(params).map(k=>`${k}=${encodeURIComponent(params[k]==null?'':params[k])}`).join('&');
}
async function apiGet(params){
  const r=await fetch(`${SHEETS_URL}?${qs({...params, pw:PAGE_PASSWORD})}`);
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||'api error');
  return j;
}
const apiListOrders=async()=> (await apiGet({action:'list'})).orders;
const apiListGift=async()=> (await apiGet({action:'listgift'})).gift;
const apiUpsert=o=>apiGet({action:'upsert', id:o.id, name:o.name, contact:o.contact,
  items:JSON.stringify(o.items), total:o.total, cash:o.cash, cooler:String(!!o.cooler),
  plus:o.plus||'', giftSerum:o.giftSerum||'', giftHydrosol:o.giftHydrosol||'',
  redeemItems:JSON.stringify(o.redeemItems||{}),
  paymethod:o.paymethod||'', paystatus:o.paystatus, deposit:o.deposit,
  ship:o.ship, note:o.note, date:o.date});
const apiDelete=id=>apiGet({action:'delete', id});
const apiWipeAll=()=>apiGet({action:'wipe'});
const apiSaveGift=(key,value)=>apiGet({action:'savegift', k:key, value});

/* ---------- storage ---------- */
function loadCache(){
  try{ const c=localStorage.getItem(CACHE_KEY); if(c) orders=JSON.parse(c); }catch(e){}
  try{ const g=localStorage.getItem(CACHE_KEY_G); if(g) giftMeta={...giftMeta,...JSON.parse(g)}; }catch(e){}
}
function saveCache(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(orders)); }catch(e){}
}
function saveGiftCache(){
  try{ localStorage.setItem(CACHE_KEY_G, JSON.stringify(giftMeta)); }catch(e){}
}
async function load(){
  loadCache();
  renderAll();
  await syncFromCloud();
}
async function syncFromCloud(){
  const t=$('#synctxt');
  if(!sheetsReady()){
    t.textContent='尚未設定同步網址，目前只存在此裝置';
    t.classList.add('bad');
    return;
  }
  t.classList.remove('bad');
  t.textContent='同步中…';
  try{
    const [os,g]=await Promise.all([apiListOrders(), apiListGift()]);
    orders=os.sort((a,b)=>new Date(b.date)-new Date(a.date));
    Object.keys(g).forEach(k=>{
      if(k==='serumStock'||k==='hydrosolStock'||k==='serumStockFull'||k==='hydrosolStockFull') giftMeta[k]={...giftMeta[k],...parseGiftMap(g[k])};
      else giftMeta[k]=parseGiftItems(g[k]);
    });
    saveCache(); saveGiftCache();
    renderAll();
    t.textContent='已同步　'+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    t.textContent='連線失敗，顯示暫存資料';
    t.classList.add('bad');
  }
}
async function syncGiftTier(k){
  saveGiftCache();
  renderBuy(); drawMeter();
  try{ await apiSaveGift(k, JSON.stringify(giftMeta[k]||[])); }
  catch(e){ toast('雲端同步失敗，請檢查網路'); }
}
function addGiftItem(k){
  giftMeta[k]=giftMeta[k]||[];
  giftMeta[k].push({name:'',qty:1});
  renderBuy();
}
function updateGiftItem(k,idx,field,value){
  if(!giftMeta[k]||!giftMeta[k][idx])return;
  giftMeta[k][idx][field]= field==='qty' ? Math.max(1,Number(value)||1) : value;
  syncGiftTier(k);
}
function removeGiftItem(k,idx){
  if(!giftMeta[k])return;
  giftMeta[k].splice(idx,1);
  syncGiftTier(k);
}
function updateFixedStock(catKey,name,value){
  giftMeta[catKey]=giftMeta[catKey]||{};
  giftMeta[catKey][name]=Math.max(0,Number(value)||0);
  syncGiftTier(catKey);
}

/* ---------- form ---------- */
function drawProducts(){
  $('#plist').innerHTML=P.map(p=>{
    const q=cart[p.id]||0;
    return `<div class="pline ${q?'picked':''}">
      <div class="pinfo">
        <div class="pstep">${p.step}</div>
        <div class="pname">${p.name}</div>
        <div class="pprice num">${p.spec}・${nt(p.price)}</div>
      </div>
      <div class="stp">
        <button onclick="bump('${p.id}',-1)" ${q?'':'disabled'} aria-label="減少">−</button>
        <span class="q num ${q?'':'zero'}">${q}</span>
        <button onclick="bump('${p.id}',1)" aria-label="增加">＋</button>
      </div></div>`;
  }).join('');
}
function bump(id,d){
  cart[id]=Math.max(0,(cart[id]||0)+d);
  if(!cart[id])delete cart[id];
  drawProducts(); drawMeter();
}
function drawMeter(){
  const t=subtotal(), T=tier(t);
  $('#m-amt').textContent=nt(t);
  $('#m-tier').textContent=T.lv;
  $('#m-bar').style.width=Math.min(100,t/10000*100)+'%';

  if(T.next){
    const cheap=P.filter(p=>p.price>=T.need).sort((a,b)=>a.price-b.price)[0];
    $('#m-gap').innerHTML= T.need<=400
      ? `再 <b>${nt(T.need)}</b> 就到 ${T.next.toLocaleString()} — 補一瓶純露就過了，回饋金差很多`
      : `再 <b>${nt(T.need)}</b> 到 ${T.next.toLocaleString()}${cheap?`（加一支${cheap.name}即可）`:''}`;
  }else{
    $('#m-gap').innerHTML=`已達最高階 — <b>回饋金 1,000</b>`;
  }

  const g2=$('#m-gap2');
  if(t>0&&t<5000){
    g2.className='gap2 on';
    g2.innerHTML=`保溫冷袋門檻 5,000 — 再 <b>${nt(5000-t)}</b>`;
  }else{g2.className='gap2';g2.innerHTML='';}

  const g=[];
  if(T.cash)g.push(`回饋金 ${T.cash}`);
  if(t>=5000){const ct=giftItemsText(giftMeta.cooler);g.push('杜邦保溫冷袋'+(ct?`（${ct}）`:''));}
  if(T.plus&&plusOpen()){
    const left=GIFTS[T.plus].quota-used(T.plus);
    const pt=T.plus==='plus10k'?giftItemsText(giftMeta[T.plus]):'';
    g.push(`加一回饋：${GIFTS[T.plus].label}${pt?`（${pt}）`:''}${left<=3?`　剩 ${left} 份`:''}`);
  }
  $('#m-gifts').textContent=g.length?'贈品：'+g.join('　/　'):'尚未達到任何贈品門檻';

  renderGiftPickSelect(T);

  const lp=$('#chip-linepay');
  if(t<8000){
    lp.disabled=true;
    if(sel.paymethod==='LINE Pay'){sel.paymethod='';lp.setAttribute('aria-pressed','false');}
    $('#payhint').className='hint'; $('#payhint').textContent='LINE Pay 需單筆滿 8,000';
  }else{
    lp.disabled=false;
    $('#payhint').className='hint'; $('#payhint').textContent='可用 LINE Pay。無分期。';
  }
}
function pickRemaining(name,excludeOrderId,field){
  const stock=stockQtyByName(name);
  let need=giftNeeds()[name]||0;
  if(excludeOrderId){
    const o=orders.find(x=>x.id===excludeOrderId);
    if(o&&o[field]===name) need-=1;
  }
  return stock-need;
}
function buildGiftChips(containerSel,names,field){
  $(containerSel).innerHTML=names.map(name=>{
    const left=pickRemaining(name,editId,field);
    const active=giftPickState[field]===name;
    return `<button type="button" class="chip" data-v="${name}" aria-pressed="${active}" onclick="pickGiftChip('${field}','${name}')">${name}（剩 ${left}）</button>`;
  }).join('');
}
function pickGiftChip(field,name){
  giftPickState[field]=(giftPickState[field]===name)?'':name;
  drawMeter();
}
function toggleFixedChip(name){
  if(checkedFixedItems.has(name)) checkedFixedItems.delete(name);
  else checkedFixedItems.add(name);
  drawMeter();
}
function buildFixedChips(){
  const items=(giftMeta.plus10k||[]).filter(it=>it.name);
  $('#gp-fixed-wrap').style.display=items.length?'block':'none';
  $('#gp-fixed-chips').innerHTML=items.map(it=>{
    const active=checkedFixedItems.has(it.name);
    return `<button type="button" class="chip" aria-pressed="${active}" onclick="toggleFixedChip('${it.name.replace(/'/g,"\\'")}')">${it.name}×${it.qty||1}${active?' ✓':''}</button>`;
  }).join('');
}
function redeemBump(name,d){
  redeemCart[name]=Math.max(0,(redeemCart[name]||0)+d);
  if(!redeemCart[name])delete redeemCart[name];
  renderRedeemBox();
}
function renderRedeemBox(){
  const eb=$('#redeem-eyebrow'), box=$('#redeembox');
  if(!editId || editingCash<=0){ eb.style.display='none'; box.style.display='none'; return; }
  eb.style.display='flex'; box.style.display='block';
  $('#redeem-list').innerHTML=FULL_ITEMS.map(it=>{
    const q=redeemCart[it.name]||0;
    return `<div class="pline ${q?'picked':''}">
      <div class="pinfo">
        <div class="pstep">${it.spec}</div>
        <div class="pname">${it.name}</div>
        <div class="pprice num">${nt(it.price)}</div>
      </div>
      <div class="stp">
        <button onclick="redeemBump('${it.name}',-1)" ${q?'':'disabled'} aria-label="減少">−</button>
        <span class="q num ${q?'':'zero'}">${q}</span>
        <button onclick="redeemBump('${it.name}',1)" aria-label="增加">＋</button>
      </div></div>`;
  }).join('');
  const total=FULL_ITEMS.reduce((s,it)=>s+(redeemCart[it.name]||0)*it.price,0);
  const usedCash=Math.min(total,editingCash);
  const owe=Math.max(0,total-editingCash);
  $('#redeem-summary').innerHTML=`兌換總額 ${nt(total)}　回饋金可折抵 ${nt(usedCash)}（共有 ${nt(editingCash)}）${owe?`　<b style="color:var(--warn)">需補差價 ${nt(owe)}</b>`:''}`;
}
function renderGiftPickSelect(T){
  const box=$('#giftpickbox');
  const isPlus10k=plusOpen()&&T.plus==='plus10k';
  const isRandom=plusOpen()&&(T.plus==='plus8k'||T.plus==='plus4k');
  if(!isPlus10k&&!isRandom){ box.style.display='none'; return; }
  box.style.display='block';
  $('#gp-hydrosol-wrap').style.display=isPlus10k?'block':'none';
  buildGiftChips('#gp-serum-chips',SERUMS,'giftSerum');
  if(isPlus10k){ buildGiftChips('#gp-hydrosol-chips',HYDROSOLS,'giftHydrosol'); buildFixedChips(); }
  else{ $('#gp-fixed-wrap').style.display='none'; }
}
function giftPickTally(tierKey){
  const serumCounts={}, hydrosolCounts={};
  orders.filter(o=>o.plus===tierKey).forEach(o=>{
    if(o.giftSerum)serumCounts[o.giftSerum]=(serumCounts[o.giftSerum]||0)+1;
    if(o.giftHydrosol)hydrosolCounts[o.giftHydrosol]=(hydrosolCounts[o.giftHydrosol]||0)+1;
  });
  return {serumCounts,hydrosolCounts};
}
function pick(el,group){
  document.querySelectorAll(`#${group} .chip`).forEach(c=>c.setAttribute('aria-pressed','false'));
  el.setAttribute('aria-pressed','true');
  sel[group]=el.dataset.v;
  if(group==='paystatus')$('#depositbox').style.display=(sel.paystatus==='已付訂金')?'block':'none';
}
function setChip(group,val){
  sel[group]=val;
  document.querySelectorAll(`#${group} .chip`).forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.v===val)));
  if(group==='paystatus')$('#depositbox').style.display=(val==='已付訂金')?'block':'none';
}

async function save(){
  const name=$('#f-name').value.trim();
  if(!name){toast('先填客人姓名');$('#f-name').focus();return;}
  const t=subtotal();
  if(!t){toast('還沒選任何品項');return;}
  const T=tier(t);
  const plus=(T.plus&&plusOpen())?T.plus:null;
  const o={
    id:editId||('o'+Date.now()),
    name, contact:$('#f-contact').value.trim(),
    items:{...cart}, total:t,
    cash:T.cash, cooler:t>=5000,
    plus,
    giftSerum:(plus==='plus10k'||plus==='plus8k'||plus==='plus4k')?(giftPickState.giftSerum||''):'',
    giftHydrosol:plus==='plus10k'?(giftPickState.giftHydrosol||''):'',
    redeemItems:{...redeemCart},
    paymethod:sel.paymethod, paystatus:sel.paystatus,
    deposit:sel.paystatus==='已付訂金'?Number($('#f-dep').value||0):(sel.paystatus==='已付清'?t:0),
    ship:sel.ship, note:$('#f-note').value.trim(),
    date:editId?(orders.find(x=>x.id===editId)||{}).date||new Date().toISOString():new Date().toISOString()
  };
  if(editId){orders=orders.map(x=>x.id===editId?o:x);}else{orders.unshift(o);}
  saveCache();
  toast(editId?'已更新':'已登記　'+nt(t));
  resetForm(); renderAll();
  try{ await apiUpsert(o); }catch(e){ toast('雲端同步失敗，稍後請按重新整理再試'); }
}
function resetForm(){
  cart={};editId=null;
  $('#f-name').value='';$('#f-contact').value='';$('#f-note').value='';$('#f-dep').value='';
  giftPickState={giftSerum:'',giftHydrosol:''};
  checkedFixedItems=new Set();
  redeemCart={};editingCash=0;
  setChip('paymethod','');setChip('paystatus','未付款');setChip('ship','待叫貨');
  $('#savebtn').textContent='儲存訂單';$('#cancelbtn').style.display='none';
  drawProducts();drawMeter();renderRedeemBox();
}
function edit(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  editId=id;cart={...o.items};
  $('#f-name').value=o.name;$('#f-contact').value=o.contact||'';$('#f-note').value=o.note||'';
  $('#f-dep').value=o.deposit||'';
  giftPickState={giftSerum:o.giftSerum||'',giftHydrosol:o.giftHydrosol||''};
  checkedFixedItems=new Set();
  redeemCart={...(o.redeemItems||{})};editingCash=o.cash||0;
  setChip('paymethod',o.paymethod||'');setChip('paystatus',o.paystatus);setChip('ship',o.ship);
  $('#savebtn').textContent='更新訂單';$('#cancelbtn').style.display='block';
  tab('new');window.scrollTo({top:0,behavior:'smooth'});
  drawProducts();drawMeter();renderRedeemBox();
}
async function del(id){
  if(!confirm('刪掉這筆訂單？'))return;
  orders=orders.filter(x=>x.id!==id);
  saveCache(); renderAll(); toast('已刪除');
  try{ await apiDelete(id); }catch(e){ toast('雲端同步失敗，請重新整理確認'); }
}
async function quickShip(id){
  const seq=['待叫貨','已叫貨','已到貨','已交付'];
  let updated=null;
  orders=orders.map(o=>{
    if(o.id!==id)return o;
    updated={...o,ship:seq[Math.min(seq.length-1,seq.indexOf(o.ship)+1)]};
    return updated;
  });
  saveCache(); renderAll();
  if(updated){ try{ await apiUpsert(updated); }catch(e){ toast('雲端同步失敗，請重新整理確認'); } }
}
async function quickPaid(id){
  let updated=null;
  orders=orders.map(o=>{
    if(o.id!==id)return o;
    updated={...o,paystatus:'已付清',deposit:o.total};
    return updated;
  });
  saveCache(); renderAll(); toast('已標記付清');
  if(updated){ try{ await apiUpsert(updated); }catch(e){ toast('雲端同步失敗，請重新整理確認'); } }
}

/* ---------- render ---------- */
const used=k=>orders.filter(o=>o.plus===k).length;

function itemText(o){
  return P.filter(p=>o.items[p.id]).map(p=>`${p.name}×${o.items[p.id]}`).join('・');
}

  }
  $('#listbox').innerHTML=rows.map(o=>{

    return `<div class="oc ${cls}">
      <div class="h"><span class="nm">${o.name}${o.contact?` <span style="font-size:12px;color:var(--ink-38)">${o.contact}</span>`:''}</span><span class="tt num">${nt(o.total)}</span></div>
      <div class="items">${itemText(o)}</div>

        <span class="tag ${o.ship==='已交付'?'g':''}">${o.ship}</span>

        ${o.cooler?`<span class="tag r">冷袋</span>`:''}
        ${o.plus?`<span class="tag r">${GIFTS[o.plus].label}${[o.giftSerum,o.giftHydrosol].filter(Boolean).length?`：${[o.giftSerum,o.giftHydrosol].filter(Boolean).join('+')}`:'（未選定）'}</span>`:''}
      </div>
      ${o.note?`<div class="items" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--ink-07)">${o.note}</div>`:''}

        <button onclick="edit('${o.id}')">編輯</button>
        <button onclick="del('${o.id}')">刪除</button>
      </div></div>`;
  }).join('');
}
function renderBuy(){
  const live=orders.filter(o=>o.ship!=='已交付');
  let tot=0;
  const rows=P.map(p=>{
    const all=orders.reduce((s,o)=>s+(o.items[p.id]||0),0);
    const pend=live.reduce((s,o)=>s+(o.items[p.id]||0),0);
    tot+=all;
    return {p,all,pend};
  });
  $('#buytable').innerHTML=`<tr><th>品項</th><th class="n">未交付</th><th class="n">總訂購</th></tr>`+
    rows.map(r=>`<tr><td>${r.p.name}<div style="font-size:11px;color:var(--ink-38)">${r.p.spec}</div></td><td class="n">${r.pend||'—'}</td><td class="n">${r.all||'—'}</td></tr>`).join('')+
    `<tr class="tot"><td>合計瓶數</td><td class="n">${live.reduce((s,o)=>s+Object.values(o.items).reduce((a,b)=>a+b,0),0)}</td><td class="n">${tot}</td></tr>`;

  const cool=orders.filter(o=>o.cooler).length;
  const pickDetail=k=>{
    const {serumCounts,hydrosolCounts}=giftPickTally(k);
    const parts=Object.entries(serumCounts).map(([n,c])=>`${n}×${c}`);
    Object.entries(hydrosolCounts).forEach(([n,c])=>parts.push(`${n}(純露)×${c}`));
    const unpickedSerum=orders.filter(o=>o.plus===k && !o.giftSerum).length;
    if(unpickedSerum)parts.push(`原液尚未選定×${unpickedSerum}`);
    if(k==='plus10k'){
      const unpickedH=orders.filter(o=>o.plus===k && !o.giftHydrosol).length;
      if(unpickedH)parts.push(`純露尚未選定×${unpickedH}`);
      const fixed=giftItemsText(giftMeta.plus10k);
      if(fixed)parts.push(fixed);
    }
    return parts.join('、');
  };
  $('#gifttable').innerHTML=`<tr><th>贈品</th><th class="n">需準備</th></tr>`+
    `<tr><td>杜邦保溫冷袋${giftItemsText(giftMeta.cooler)?`<div style="font-size:11px;color:var(--ink-38)">${giftItemsText(giftMeta.cooler)}</div>`:''}</td><td class="n">${cool||'—'}</td></tr>`+
    Object.keys(GIFTS).map(k=>{
      const detail=pickDetail(k);
      return `<tr><td>${GIFTS[k].label}${detail?`<div style="font-size:11px;color:var(--ink-38)">${detail}</div>`:''}</td><td class="n">${used(k)||'—'}</td></tr>`;
    }).join('');

  renderGiftNeeds();
  renderFullNeeds();

  const fixedGrid=(catKey,names,label,priceMap)=>`<div style="margin-bottom:18px"><label class="fl">${label}</label>`+
    names.map(name=>`
    <div class="gm-row">
      <input type="text" value="${name}${priceMap?`　NT$${priceMap[name]}`:''}" disabled style="opacity:.7">
      <input type="number" min="0" value="${(giftMeta[catKey]&&giftMeta[catKey][name])||0}" onchange="updateFixedStock('${catKey}','${name}',this.value)">
    </div>`).join('')+`</div>`;

  const fields=[
    ['plus10k','旅行養膚組（10,000 檔）固定加贈（例如面膜）','例：面膜'],
    ['cooler','杜邦保溫冷袋（滿 5,000）','例：中號保冷袋'],
    ['stock','其他庫存（不會再進貨，用完就沒了）','例：面膜'],
  ];
  $('#giftmeta').innerHTML=
    fixedGrid('serumStock',SERUMS,'原液庫存（旅行 5ml，9 款，共用於 10,000／8,000／4,000 檔）')+
    fixedGrid('hydrosolStock',HYDROSOLS,'純露庫存（旅行 5ml，5 款，只用於 10,000 檔）')+
    fields.map(([k,lb,ph])=>{
    const items=giftMeta[k]||[];
    return `<div style="margin-bottom:18px"><label class="fl">${lb}</label>`+
      (items.length?items.map((it,idx)=>`
      <div class="gm-row">
        <input type="text" value="${(it.name||'').replace(/"/g,'&quot;')}" placeholder="${ph}" onchange="updateGiftItem('${k}',${idx},'name',this.value)">
        <input type="number" min="1" value="${it.qty||1}" onchange="updateGiftItem('${k}',${idx},'qty',this.value)">
        <button onclick="removeGiftItem('${k}',${idx})" aria-label="刪除">×</button>
      </div>`).join(''):'')+
      `<button class="btn ghost" style="margin-top:0" onclick="addGiftItem('${k}')">＋ 新增品項</button></div>`;
  }).join('')+
    `<div class="hint">原液／純露的名稱是固定的，填數量就好。「旅行養膚組固定加贈」跟「其他庫存」品項名稱要打一樣，才能對得起來、算出剩餘量。改了會自動更新上面的採購統計表。</div>`;

  $('#fullstockmeta').innerHTML=
    fixedGrid('serumStockFull',SERUMS,'原液正裝庫存（30ml，現貨售完為止）',SERUM_FULL_PRICE)+
    fixedGrid('hydrosolStockFull',HYDROSOLS,'純露正裝庫存（100ml，現貨售完為止）',HYDROSOL_FULL_PRICE)+
    `<div class="hint">這是客人拿回饋金換購的正裝現貨，跟上面的旅行組贈品是分開算的庫存。</div>`;
}
function fullStockQtyByName(name){
  if(giftMeta.serumStockFull && name in giftMeta.serumStockFull) return Number(giftMeta.serumStockFull[name])||0;
  if(giftMeta.hydrosolStockFull && name in giftMeta.hydrosolStockFull) return Number(giftMeta.hydrosolStockFull[name])||0;
  return 0;
}
function fullPriceByName(name){
  return SERUM_FULL_PRICE[name] ?? HYDROSOL_FULL_PRICE[name] ?? 0;
}
function redeemTag(o){
  const items=o.redeemItems||{};
  const names=Object.keys(items);
  if(!names.length) return `<span class="tag r">回饋金 ${nt(o.cash)}・未兌換</span>`;
  const total=names.reduce((s,n)=>s+(Number(items[n])||0)*fullPriceByName(n),0);
  const owe=Math.max(0,total-o.cash);
  const list=names.map(n=>`${n}×${items[n]}`).join('、');
  return `<span class="tag g">已兌換：${list}${owe?`（補差價 ${nt(owe)}）`:''}</span>`;
}
function fullNeeds(){
  const needs={};
  orders.forEach(o=>{
    Object.entries(o.redeemItems||{}).forEach(([name,qty])=>{
      needs[name]=(needs[name]||0)+(Number(qty)||0);
    });
  });
  return needs;
}
function renderFullNeeds(){
  const needs=fullNeeds();
  $('#fullneeds').innerHTML=`<tr><th>品項</th><th class="n">單價</th><th class="n">庫存</th><th class="n">已兌換</th><th class="n">剩餘</th></tr>`+
    FULL_ITEMS.map(it=>{
      const stock=fullStockQtyByName(it.name), need=needs[it.name]||0, left=stock-need;
      return `<tr><td>${it.name}<div style="font-size:11px;color:var(--ink-38)">${it.spec}</div></td><td class="n">${nt(it.price)}</td><td class="n">${stock}</td><td class="n">${need}</td><td class="n" style="${left<0?'color:var(--warn);font-weight:700':''}">${left}</td></tr>`;
    }).join('');
}
function stockQtyByName(name){
  if(giftMeta.serumStock && name in giftMeta.serumStock) return Number(giftMeta.serumStock[name])||0;
  if(giftMeta.hydrosolStock && name in giftMeta.hydrosolStock) return Number(giftMeta.hydrosolStock[name])||0;
  const row=(giftMeta.stock||[]).find(i=>i.name===name);
  return row?Number(row.qty)||0:0;
}
function giftNeeds(){
  const needs={};
  const cnt10k=used('plus10k');
  if(cnt10k)(giftMeta.plus10k||[]).forEach(it=>{
    if(!it.name)return;
    needs[it.name]=(needs[it.name]||0)+(Number(it.qty)||0)*cnt10k;
  });
  const coolCount=orders.filter(o=>o.cooler).length;
  (giftMeta.cooler||[]).forEach(it=>{
    if(!it.name)return;
    needs[it.name]=(needs[it.name]||0)+(Number(it.qty)||0)*coolCount;
  });
  orders.forEach(o=>{
    if((o.plus==='plus10k'||o.plus==='plus8k'||o.plus==='plus4k')&&o.giftSerum){
      needs[o.giftSerum]=(needs[o.giftSerum]||0)+1;
    }
    if(o.plus==='plus10k'&&o.giftHydrosol){
      needs[o.giftHydrosol]=(needs[o.giftHydrosol]||0)+1;
    }
  });
  return needs;
}
function renderGiftNeeds(){
  const needs=giftNeeds();
  const names=[...new Set([...SERUMS, ...HYDROSOLS, ...Object.keys(needs), ...(giftMeta.stock||[]).map(i=>i.name).filter(Boolean)])];
  $('#giftneeds').innerHTML=`<tr><th>品項</th><th class="n">庫存</th><th class="n">需求</th><th class="n">剩餘</th></tr>`+
    (names.length?names.map(name=>{
      const stock=stockQtyByName(name), need=needs[name]||0, left=stock-need;
      return `<tr><td>${name}</td><td class="n">${stock}</td><td class="n">${need}</td><td class="n" style="${left<0?'color:var(--warn);font-weight:700':''}">${left}</td></tr>`;
    }).join(''):`<tr><td colspan="4" style="color:var(--ink-38);text-align:center;padding:16px 4px">下面先設定庫存與各檔次贈品內容</td></tr>`);
}
function renderSum(){
  const t=orders.reduce((s,o)=>s+o.total,0);
  const paid=orders.reduce((s,o)=>s+(o.deposit||0),0);
  $('#g-amt').textContent=nt(t);
  $('#g-bar').style.width=Math.min(100,t/GOAL*100)+'%';
  $('#g-note').textContent=t>=GOAL?`已超過 12 萬目標 ${nt(t-GOAL)}`:`距離 12 萬還有 ${nt(GOAL-t)}`;
  $('#s-cnt').textContent=orders.length;
  $('#s-avg').textContent=nt(orders.length?Math.round(t/orders.length):0);
  $('#s-in').textContent=nt(paid);
  $('#s-out').textContent=nt(t-paid);

  $('#quota').innerHTML=Object.keys(GIFTS).map(k=>{
    const u=used(k),left=GIFTS[k].quota-u,pct=left/GIFTS[k].quota*100;
    return `<div class="qbar"><span class="lb">${GIFTS[k].label}</span>
      <span class="track"><i class="${left<=3?'low':''}" style="width:${pct}%"></i></span>
      <span class="v">${left} / 10</span></div>`;
  }).join('');

  const cb=orders.reduce((s,o)=>s+(o.cash||0),0);
  $('#cashback').innerHTML=`<div style="font-size:22px;font-weight:700" class="num">${nt(cb)}</div>
    <div style="font-size:12.5px;color:var(--ink-60);margin-top:5px">限用於原液・純露。這是已經預約好的下一次回購，記得追。</div>`;
}
function renderAll(){drawProducts();drawMeter();renderList();renderBuy();renderSum();}

function exportCSV(){
  const head=['日期','姓名','聯絡','金額','付款方式','付款狀態','已收','出貨','回饋金','冷袋','加一回饋','贈送原液','贈送純露','備註',...P.map(p=>p.name)];
  const rows=orders.map(o=>[
    new Date(o.date).toLocaleDateString('zh-TW'),o.name,o.contact||'',o.total,o.paymethod||'',o.paystatus,o.deposit||0,o.ship,
    o.cash||0,o.cooler?'是':'',o.plus?GIFTS[o.plus].label:'',o.giftSerum||'',o.giftHydrosol||'',(o.note||'').replace(/[\n,]/g,' '),
    ...P.map(p=>o.items[p.id]||0)
  ]);
  const csv='﻿'+[head,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='NINI新品訂單.csv';a.click();
  toast('已匯出');
}
async function wipe(){
  if(!confirm('會清掉全部訂單，確定？'))return;
  if(!confirm('真的確定？這個動作救不回來。'))return;
  orders=[];
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
  renderAll();toast('已清空');
  try{ await apiWipeAll(); }catch(e){ toast('雲端清除失敗，請檢查網路後重試'); }
}
function tab(k){
  ['new','list','buy','sum'].forEach(x=>{
    $('#s-'+x).classList.toggle('on',x===k);
    $('#t-'+x).setAttribute('aria-selected',String(x===k));
  });
}
let tmr;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>t.classList.remove('on'),2100);}

(function init(){
  checkUnlock();
  const f=$('#plusflag');
  if(plusOpen()){
    const d=Math.ceil((PLUS_END-new Date())/86400000);
    f.textContent=`加一回饋進行中・還剩 ${d} 天（8/10 收單）`;
  }else{f.className='plusflag off';f.textContent='加一回饋已結束・現在只給基本回饋金';}
  drawProducts();drawMeter();load();
  setInterval(()=>{ if(document.visibilityState==='visible') syncFromCloud(); }, 25000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') syncFromCloud(); });
})();
</script>
